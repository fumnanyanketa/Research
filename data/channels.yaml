# Source map for the fetcher scripts.
#
# watch_channels: podcast/interview YouTube channels scanned for appearances.
#   The transcript fetcher lists each channel's uploads, matches video titles
#   against each person's `aliases`, and pulls captions.
# people.<slug>.blogs: RSS/Atom feeds pulled by the blog fetcher.
# people.<slug>.youtube: a person's own channel (scanned directly).

watch_channels:
