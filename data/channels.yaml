# Source map for the fetcher scripts.
#
# watch_channels: podcast/interview YouTube channels scanned for appearances.
#   The transcript fetcher lists each channel's uploads since --since, matches
#   video title/description against each person's `aliases`, and pulls captions.
# people.<slug>.blogs: RSS/Atom feeds pulled by the blog fetcher.
# people.<slug>.youtube: a person's own channel (scanned in full, no alias match).

watch_channels:
  - name: Dwarkesh Podcast
    url: https://www.youtube.com/@DwarkeshPatel
  - name: Lex Fridman
    url: https://www.youtube.com/@lexfridman
