<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Africa Week 2027 · Share your ideas</title>
<style>
  :root{
    --ink:#1c1a17;--muted:#6f6862;--line:#e7e1d8;--bg:#ffffff;
    --card:#ffffff;--tint:#faf8f4;--accent:#c75b39;--accent-soft:#f3e4dd;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:64px 24px 88px;}
  .back{display:inline-block;font-size:14px;color:var(--muted);text-decoration:none;margin-bottom:30px;}
  .back:hover{color:var(--accent);}
  .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:16px;}
  h1{font-size:clamp(30px,6vw,42px);line-height:1.08;letter-spacing:-.02em;font-weight:700;margin-bottom:16px;}
  .lede{font-size:17px;color:var(--muted);margin-bottom:40px;}

  form{display:flex;flex-direction:column;gap:22px;}
  .field{display:flex;flex-direction:column;gap:8px;}
  label{font-size:14px;font-weight:600;letter-spacing:-.01em;}
  label .opt{color:var(--muted);font-weight:400;}
  input,textarea{
    font:inherit;color:var(--ink);background:var(--tint);
    border:1px solid var(--line);border-radius:11px;padding:13px 15px;width:100%;
    transition:border-color .15s ease, background .15s ease;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent);background:#fff;}
  textarea{min-height:150px;resize:vertical;}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden;}

  button{
    font:inherit;font-weight:600;font-size:16px;color:#fff;background:var(--accent);
    border:0;border-radius:11px;padding:15px;cursor:pointer;margin-top:6px;
    transition:background .15s ease, transform .15s ease;
  }
  button:hover{background:#a8472a;transform:translateY(-1px);}
  button:disabled{opacity:.6;cursor:default;transform:none;}

  .msg{font-size:14px;padding:13px 15px;border-radius:11px;display:none;}
  .msg.err{display:block;background:#fdece7;color:#9a371d;border:1px solid #f3c9bd;}

  .done{display:none;text-align:center;padding:30px 0;}
  .done .check{width:60px;height:60px;border-radius:50%;background:var(--accent-soft);color:var(--accent);
    display:flex;align-items:center;justify-content:center;margin:0 auto 22px;}
  .done h2{font-size:26px;letter-spacing:-.01em;margin-bottom:12px;text-transform:none;color:var(--ink);}
  .done p{color:var(--muted);}
  .done a{color:var(--accent);text-decoration:none;font-weight:600;}

  footer{margin-top:56px;text-align:center;color:var(--muted);font-size:13px;}
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="./index.html">&larr; Back</a>
  <div class="kicker">Get involved</div>
  <h1>Share your ideas</h1>
  <p class="lede">Tell us who you are and what you would love to see, do, or help build for Africa Week 2027. Every idea is read.</p>

  <form id="ideaForm" novalidate>
    <div class="field">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>
    </div>
    <div class="field">
      <label for="phone">Phone <span class="opt">(optional)</span></label>
      <input id="phone" name="phone" type="tel" autocomplete="tel" inputmode="tel">
    </div>
    <div class="field">
      <label for="email">Email <span class="opt">(optional)</span></label>
      <input id="email" name="email" type="email" autocomplete="email" inputmode="email">
    </div>
    <div class="field">
      <label for="ideas">Your ideas</label>
      <textarea id="ideas" name="ideas" placeholder="Share whatever you have in mind. A workstream you want to join, something you want to see, an idea, a connection, anything." required></textarea>
    </div>

    <!-- spam honeypot, hidden from people -->
    <div class="hp"><label for="website">Website</label><input id="website" name="website" type="text" tabindex="-1" autocomplete="off"></div>

    <div class="msg err" id="errMsg"></div>
    <button type="submit" id="submitBtn">Send it in</button>
  </form>

  <div class="done" id="done">
    <div class="check"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
    <h2>Thank you</h2>
    <p>Your idea is in. We read every one.<br><a href="./index.html">Back to Start Here</a></p>
  </div>

  <footer>Africa Week 2027 · Museum of Technology, Helsinki</footer>

</div>

<script>
  const form = document.getElementById('ideaForm');
  const btn = document.getElementById('submitBtn');
  const errMsg = document.getElementById('errMsg');
  const done = document.getElementById('done');

  function showErr(t){ errMsg.textContent = t; errMsg.style.display = 'block'; }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errMsg.style.display = 'none';

    const fd = new FormData(form);
    const get = (k) => (fd.get(k) || '').toString().trim();
    const data = {
      name: get('name'),
      phone: get('phone'),
      email: get('email'),
      ideas: get('ideas'),
      website: get('website') // honeypot
    };

    if (!data.name || !data.ideas){ showErr('Please add your name and your ideas.'); return; }
    if (data.email && !/^\S+@\S+\.\S+$/.test(data.email)){ showErr('That email does not look right.'); return; }

    btn.disabled = true; btn.textContent = 'Sending...';
    try {
      const res = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok){
        const j = await res.json().catch(() => ({}));
        throw new Error(j.error || 'Something went wrong. Please try again.');
      }
      form.style.display = 'none';
      done.style.display = 'block';
    } catch (err){
      showErr(err.message);
      btn.disabled = false; btn.textContent = 'Send it in';
    }
  });
</script>
</body>
</html>
